name: Build und Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: node --test tests/tasks-core.test.mjs
      - run: cargo fmt --check
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
      - run: cargo test --locked --target x86_64-pc-windows-msvc
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Aufgaben im Windows-Browser prüfen
        shell: pwsh
        run: |
          npm install --prefix work/browser-tools --no-save playwright-core@1.57.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HOMEBOARD_PLAYWRIGHT_MODULE=(Resolve-Path work/browser-tools/node_modules/playwright-core).Path
          $env:HOMEBOARD_TEST_EXE=(Resolve-Path target/x86_64-pc-windows-msvc/release/homeboard.exe).Path
          $env:HOMEBOARD_CHROMIUM="${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (!(Test-Path $env:HOMEBOARD_CHROMIUM)) { $env:HOMEBOARD_CHROMIUM="$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe" }
          node tests/browser-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer kompilieren
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Homeboard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dienst und Installer prüfen
        shell: pwsh
        run: ./tests/windows-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: homeboard-windows-build
          path: |
            target/x86_64-pc-windows-msvc/release/homeboard.exe
            dist/Homeboard-Setup-0.2.0-beta.exe
